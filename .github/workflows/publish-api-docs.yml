name: Publish API docs and test coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Checkout the CRESYM/Harmony-Doc repo
      - name: Checkout Harmony-Doc
        uses: actions/checkout@v4

      # Checkout the CRESYM/Harmony repo
      - name: Checkout Harmony
        uses: actions/checkout@v4
        with:
          repository: CRESYM/Harmony
          path: harmony
          ref: main
          # Use HARMONY_REPO_TOKEN when Harmony is private (see repo secrets).
          #token: ${{ secrets.HARMONY_REPO_TOKEN || github.token }}

      # Install dependencies
      - name: Install Doxygen and Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      # Set CMake variables in Doxyfile.in and execute Doxygen to generate HTML output
      - name: Build Doxygen HTML
        run: |
          set -euo pipefail
          harmony="${GITHUB_WORKSPACE}/harmony"
          out="${harmony}/build/docs"
          mkdir -p "${harmony}/build"
          sed \
            -e "s|@CMAKE_SOURCE_DIR@|${harmony}|g" \
            -e "s|@DOXYGEN_OUTPUT_DIR@|${out}|g" \
            "${harmony}/docs/Doxyfile.in" > "${harmony}/build/Doxyfile"
          doxygen "${harmony}/build/Doxyfile"
          test -f "${out}/html/index.html"

      # Replace old API directory with the newly built HTML files
      # Create .nojekyll files to disable GitHub Pages' Jekyll processing
      - name: Publish to api/
        run: |
          rm -rf api
          cp -R "${GITHUB_WORKSPACE}/harmony/build/docs/html" api
          touch .nojekyll api/.nojekyll

      # Fetch the latest successful coverage report artifact produced by CRESYM/Harmony's test_coverage workflow
      - name: Download test coverage artifact from CRESYM/Harmony repo
        uses: dawidd6/action-download-artifact@v6
        with:
          repo: CRESYM/Harmony
          workflow: test_coverage.yml
          name: harmony-test-coverage
          workflow_conclusion: success
          path: ./test_coverage

      # If there are changes in the API of tst coverage report, commit them to the Harmony-Doc repo
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/ .nojekyll
          git add test_coverage/
          git diff --staged --quiet && echo "No changes to the API docs or test coverage report." && exit 0
          git commit -m "Update Doxygen API docs and test coverage report from CRESYM/Harmony@main"
          git push
