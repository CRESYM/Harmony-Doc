  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title id="pageTitle">Harmony</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

      --font-mono: "JetBrains Mono","IBM Plex Mono","Source Code Pro","Cascadia Code",Consolas,Menlo,"Liberation Mono","DejaVu Sans Mono","Courier New",monospace;
      --brand-cpp-blue:#005696;

      --color-bg:#ffffff;
      --color-ink:#111;
      --color-card:#fff;
      --color-border:#e5e7eb;

      --nav-accent:#ab80d3;
      --sticky-top: 72px;

      --search-hit-bg:#f3d6dc;
      --search-hit-fg:#6b0f1a;
    }
    html.theme-dark{
      --color-bg:#1a0b2e;
      --color-ink:#e5e5e5;
      --color-card:#1f2937;
      --color-border:#374151;

      --search-hit-bg:#6b0f1a;
      --search-hit-fg:#f3d6dc;
    }

    body{
      margin:0;
      background:var(--color-bg);
      color:var(--color-ink);
      font:16px/1.7 system-ui, Segoe UI, Roboto, Arial, sans-serif;
      transition: background .25s ease, color .25s ease;
    }

    .navbar{ background: var(--brand-cpp-blue) !important; border-bottom:none; }
    .navbar,
    .navbar a,
    .navbar .nav-link,
    .navbar .dropdown-item{ font-family: var(--font-mono) !important; }
    .navbar.navbar-dark .navbar-brand,
    .navbar.navbar-dark .nav-link{ color:#fff !important; }
    .navbar .nav-link,
    .navbar .nav-link i{ transition: color .15s ease; }

    .navbar .nav-link:hover,
    .navbar .nav-link:focus,
    .navbar .nav-link:focus-visible{ color: var(--nav-accent) !important; }
    .navbar .nav-link:hover i,
    .navbar .nav-link:focus i,
    .navbar .nav-link:focus-visible i{ color: var(--nav-accent) !important; }

    .navbar .nav-link.active{ color:#fff !important; }
    .navbar .nav-link.active i{ color:#fff !important; }

    .navbar .nav-link.dropdown-toggle:hover,
    .navbar .nav-link.dropdown-toggle:focus,
    .navbar .nav-link.dropdown-toggle:focus-visible,
    .navbar .nav-item.dropdown.show > .nav-link.dropdown-toggle{
      color: var(--nav-accent) !important;
    }

    .navbar-brand img{ height:48px; width:auto; display:block; }

    .header-tools{ display:flex; align-items:center; gap:.75rem; margin-left:.5rem; }
    .theme-switch{
      position:relative;
      width:44px; height:24px;
      background:#cbd5e1;
      border-radius:999px;
      cursor:pointer;
      transition:background .2s ease;
      border:1px solid rgba(255,255,255,.6);
    }
    .theme-switch::after{
      content:"";
      position:absolute; top:50%; left:3px;
      transform:translateY(-50%);
      width:18px; height:18px;
      border-radius:50%;
      background:#fff;
      transition:left .2s ease;
      box-shadow:0 1px 2px rgba(0,0,0,.15);
    }
    html.theme-dark .theme-switch{ background:#334155; border-color: var(--color-border); }
    html.theme-dark .theme-switch::after{ left:23px; }

    .search-btn{
      border:1px solid rgba(255,255,255,.55);
      background: rgba(255,255,255,.12);
      color:#fff;
      border-radius: 10px;
      padding: .28rem .55rem;
      display:flex; align-items:center; justify-content:center;
    }
    .search-btn:hover{ color: var(--nav-accent); border-color: rgba(171,128,211,.7); }

    .search-panel{
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      width: min(860px, calc(100% - 2rem));
      z-index: 1030;
      display:flex;
      align-items:center;
      gap:.6rem;
      padding:.55rem .75rem;
      border-radius: 14px;
      border: 1px solid var(--color-border);
      background: var(--color-card);
      box-shadow: 0 18px 40px rgba(0,0,0,.12);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    .search-panel.show{
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(6px);
    }
    .search-panel input{
      flex:1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--color-ink);
      font-family: var(--font-mono);
    }
    .search-cancel{
      border:none;
      background: transparent;
      color: var(--nav-accent);
      font-family: var(--font-mono);
      font-weight: 700;
    }

    .hdoc-layout{
      width: min(1600px, calc(100% - 2rem));
      margin: 1.25rem auto 3rem;
      display: grid !important;
      grid-template-columns: 280px minmax(0, 1fr) 260px !important;
      gap: 1rem;
      align-items: start;
    }

    .hdoc-sidenav,
    .hdoc-toc{
      position: sticky;
      top: var(--sticky-top);
      align-self: start;
      max-height: calc(100vh - var(--sticky-top) - 16px);
      overflow: auto;
      padding-right: 4px;
    }

    .hdoc-sidenav, .hdoc-sidenav *{ font-family: var(--font-mono) !important; }
    .hdoc-toc, .hdoc-toc *{ font-family: var(--font-mono) !important; }

    .sidenav-card, .toc-card{ background: transparent; border: none; box-shadow: none; padding: .25rem 0; }

    .sidenav-acc{
      width: 100%;
      display: flex;
      align-items: center;
      gap: .55rem;
      padding: .6rem .75rem;
      background: transparent;
      border: none;
      color: var(--color-ink);
      cursor: pointer;
      font-weight: 900;
      font-size: 1.15rem;
      text-align: left;
      border-radius: 10px;
    }
    .sidenav-acc:hover{ color: var(--nav-accent); }
    .sidenav-acc .acc-icon{ font-size: .95rem; }

    .acc-panel{ padding: .25rem 0 .25rem .15rem; }

    .hdoc-sidenav .list-group-item{
      border: none !important;
      background: transparent !important;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--color-ink);
      transition: all 0.18s ease;
      padding: 0.35rem 0.75rem;
      padding-left: 1.75rem;
      line-height: 1.4;
    }
    .hdoc-sidenav .list-group-item::before{
      content: "▸";
      display: inline-block;
      margin-right: .6rem;
      font-size: .85rem;
      color: var(--color-ink);
      transform: translateY(-1px);
    }
    .hdoc-sidenav .list-group-item:hover{
      color: var(--nav-accent) !important;
      transform: translateX(6px);
      font-weight: 700;
    }
    .hdoc-sidenav .list-group-item.active{
      color: var(--nav-accent) !important;
      font-weight: 800;
    }
    .hdoc-sidenav .list-group-item.active::before{
      content: "●";
      color: var(--nav-accent);
    }

    .toc-title{ font-weight: 900; margin: 0 0 .6rem 0; font-size: 1rem; }

    .toc-links{ position: relative; padding-left: 18px; }
    .toc-links::before{
      content:"";
      position:absolute;
      left: 6px; top: 4px; bottom: 4px;
      width: 4px; border-radius: 999px;
      background: rgba(171,128,211,.35);
    }
    .toc-links::after{
      content:"";
      position:absolute;
      left: 5px;
      top: var(--thumb-top, 10px);
      width: 6px; height: 22px;
      border-radius: 999px;
      background: var(--nav-accent);
      box-shadow: 0 8px 20px rgba(171,128,211,.35);
      transition: top .18s ease, height .18s ease;
    }
    .toc-links a{

      display:block;

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- light/dark mode theme toggle -->
  <script>
    (function(){
      const root = document.documentElement;
      const KEY  = "harmony-theme";
      const btn  = document.getElementById("themeToggle");

      const saved = localStorage.getItem(KEY);
      if (saved === "dark") root.classList.add("theme-dark");
      if (saved === "light") root.classList.remove("theme-dark");
      if (saved === null && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches){
        root.classList.add("theme-dark");
      }

      btn?.addEventListener("click", () => {
        root.classList.toggle("theme-dark");
        localStorage.setItem(KEY, root.classList.contains("theme-dark") ? "dark" : "light");
      });
    })();
  </script>

  <!-- Adjusts sidebar menus so they stay glued to the bottom of the navigation bar as user scrolls or resizes the page. -->
  <script>
    (function(){
      const root = document.documentElement;
      const nav  = document.querySelector("nav.navbar");
      if(!nav) return;

      let ticking = false;
      function updateStickyTop(){
        const rect = nav.getBoundingClientRect();
        root.style.setProperty("--sticky-top", Math.max(0, Math.floor(rect.bottom)) + "px");
        ticking = false;
      }
      function requestUpdate(){
        if(ticking) return;
        ticking = true;
        requestAnimationFrame(updateStickyTop);
      }
      window.addEventListener("scroll", requestUpdate, { passive: true });
      window.addEventListener("resize", requestUpdate);
      updateStickyTop();
    })();
  </script>

  <!-- Table of contents (right-side menu) -->
  <script>
    function buildTOC(){
      const tocRoot = document.getElementById("toc-root");
      const iframe = document.getElementById("contentFrame");
      if(!tocRoot || !iframe) return;

      const doc = iframe.contentDocument;
      const win = iframe.contentWindow;
      if(!doc || !win) return;

      tocRoot.innerHTML = "";

      let headers = Array.from(doc.querySelectorAll("h1, h2, h3"));
      if (!headers.length){
        tocRoot.innerHTML = `<span style="opacity:.7;font-size:14px">No sections</span>`;
        return;
      }

      if (headers[0].tagName.toLowerCase() === "h1") headers = headers.slice(1);
      if (!headers.length) headers = Array.from(doc.querySelectorAll("h2, h3"));

      if(!headers.length){
        tocRoot.innerHTML = `<span style="opacity:.7;font-size:14px">No sections</span>`;
        return;
      }

      const items = [];

      headers.forEach(h=>{
        if(!h.id){
          const slug = h.textContent.trim().toLowerCase()
            .replace(/[\s]+/g,'-')
            .replace(/[^\w\-]/g,'');
          h.id = slug || ("sec-" + Math.random().toString(16).slice(2));
        }

        const a = document.createElement("a");
        a.textContent = h.textContent.trim();
        if(h.tagName.toLowerCase() === "h3") a.classList.add("lvl-3");

        a.addEventListener("click", (e)=>{
          e.preventDefault();
          const target = doc.getElementById(h.id);
          if(!target) return;
          target.scrollIntoView({ behavior:"smooth", block:"start" });
          try { win.location.hash = "#" + h.id; } catch(_) {}
        });

        tocRoot.appendChild(a);
        items.push({ link: a, el: h });
      });

      function updateThumb(){
        const active = tocRoot.querySelector("a.active");
        if(!active) return;
        const rootRect = tocRoot.getBoundingClientRect();
        const aRect = active.getBoundingClientRect();
        const top = Math.max(4, (aRect.top - rootRect.top) + (aRect.height/2) - 11);
        tocRoot.style.setProperty("--thumb-top", top + "px");
      }

      function setActiveByScroll(){
        const y = win.scrollY;
        let best = null;
        for(const it of items){
          const t = it.el.getBoundingClientRect().top + y;
          if(t <= y + 140) best = it;
          else break;
        }
        items.forEach(x=>x.link.classList.remove("active"));
        if(best) best.link.classList.add("active");
        updateThumb();
      }

      win.addEventListener("scroll", setActiveByScroll, { passive:true });
      window.addEventListener("resize", updateThumb);
      setActiveByScroll();
    }
  </script>

  <!-- Manages search in-page box -->
  <script>
    function clearHighlightsInIframe(doc){
      doc.querySelectorAll("span.search-hit").forEach(span=>{
        const p = span.parentNode;
        while(span.firstChild) p.insertBefore(span.firstChild, span);
        p.removeChild(span);
        p.normalize();
      });
    }

    function highlightAllInIframe(doc, term){
      clearHighlightsInIframe(doc);
      if(!term || term.length < 3) return 0;

      const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const rx = new RegExp(escaped, "gi");

      const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, {
        acceptNode(node){
          if(!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          const p = node.parentNode;
          if(!p) return NodeFilter.FILTER_REJECT;
          const tag = (p.nodeName || "").toLowerCase();
          if(["script","style","noscript","input","textarea","svg"].includes(tag)) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      });

      const nodes = [];
      let n;
      while((n = walker.nextNode())) nodes.push(n);

      let hits = 0;
      nodes.forEach(textNode=>{
        const text = textNode.nodeValue;
        rx.lastIndex = 0;

        const matches = [];
        let m;
        while((m = rx.exec(text)) !== null){
          matches.push([m.index, m.index + m[0].length]);
          if(m.index === rx.lastIndex) rx.lastIndex++;
        }
        if(!matches.length) return;

        for(let i = matches.length - 1; i >= 0; i--){
          const [s,e] = matches[i];
          const range = doc.createRange();
          range.setStart(textNode, s);
          range.setEnd(textNode, e);

          const mark = doc.createElement("span");
          mark.className = "search-hit";
          mark.style.background = getComputedStyle(document.documentElement).getPropertyValue("--search-hit-bg").trim();
          mark.style.color = getComputedStyle(document.documentElement).getPropertyValue("--search-hit-fg").trim();
          mark.style.borderRadius = "3px";
          mark.style.padding = "0 .06em";
          range.surroundContents(mark);
          hits++;
        }
      });

      return hits;
    }

    (function(){
      const openBtn  = document.getElementById("openSearch");
      const bar      = document.getElementById("searchBar");
      const input    = document.getElementById("searchBarInput");
      const closeBtn = document.getElementById("searchBarClose");
      const iframe   = document.getElementById("contentFrame");
      if(!openBtn || !bar || !iframe) return;

      function open(){
        bar.classList.add("show");
        bar.setAttribute("aria-hidden","false");
        input && (input.focus(), input.select());
      }
      function close(){
        bar.classList.remove("show");
        bar.setAttribute("aria-hidden","true");
        if(input) input.value = "";
        const doc = iframe.contentDocument;
        if(doc) clearHighlightsInIframe(doc);
      }

      openBtn.addEventListener("click", () => bar.classList.contains("show") ? close() : open());
      closeBtn && closeBtn.addEventListener("click", close);

      document.addEventListener("keydown", (e)=>{ if(e.key === "Escape") close(); });
      document.addEventListener("click", (e)=>{
        if (!bar.contains(e.target) && !openBtn.contains(e.target)) close();
      });

      input?.addEventListener("input", ()=>{
        const doc = iframe.contentDocument;
        const win = iframe.contentWindow;
        if(!doc || !win) return;
        const term = input.value.trim();
        const hits = highlightAllInIframe(doc, term);
        if(hits){
          const last = doc.querySelector("span.search-hit:last-of-type");
          if(last){
            const top = last.getBoundingClientRect().top + win.scrollY - 120;
            win.scrollTo({ top, behavior:"smooth" });
          }
        }
      });
    })();
  </script>

  <!-- Ensures headings inside the main document don't get hidden behind the navigation bar when scrolled to, and automatically triggers the "On this page" table of contents to update.  -->
  <script>
    (function(){
      const iframe = document.getElementById("contentFrame");
      if(!iframe) return;

      iframe.addEventListener("load", () => {
        const doc = iframe.contentDocument;
        if(!doc) return;

        const style = doc.createElement("style");
        style.textContent = `
          h1, h2, h3, h4, h5, h6 { scroll-margin-top: 90px; }
        `;
        (doc.head || doc.documentElement).appendChild(style);

        buildTOC();
      });
    })();
  </script>

        about: {
          title: "About",
          items: [
            { id: "overview", label: "Overview", src: "../index.html", page_layout: false },
            { id: "team", label: "Team", src: "./teams.html", page_layout: false },
            { id: "getting_started", label: "Getting Started", src: "./getting-started.html", page_layout: true },
            { id: "publications", label: "Publications", src: "./publications.html", page_layout: true },
            { id: "api_reference", label: "API Reference (Doxygen)", src: "../api/index.html", page_layout: false },
            { id: "terms", label: "Terms of Reference", src: "./terms.html", page_layout: true }
          ]
        }
      }
    };

    // 2. PARSE QUERY PARAMETER
    const params = new URLSearchParams(window.location.search);
    const currentFile = (params.get("file") || "").toLowerCase();

    // 3. LOCATE CATEGORY, SECTION AND ACTIVE FILE
    let activeCategory = null;
    let activeSection = null;
    let activeItem = null;

    categoryLoop: for (const catKey in siteConfig.categories) {
      const category = siteConfig.categories[catKey];

      // If Category has nested sections (e.g. models)
      if (category.sections) {
        for (const secKey in category.sections) {
          const section = category.sections[secKey];
          const found = section.items?.find((item) => item.id.toLowerCase() === currentFile);
          if (found) {
            activeCategory = category;
            activeSection = section;
            activeItem = found;
            break categoryLoop; // Exit all loops once found
          }
        }
      }
      // If Category has direct items with no sub-sections (e.g. solvers)
      else {
        const found = category.items.find((item) => item.id.toLowerCase() === currentFile);
        if (found) {
          activeCategory = category;
          activeSection = null;
          activeItem = found;
          break categoryLoop; // Exit all loops once found
        }
      }
    }

    // Fallback to the first category & item if the parameter doesn't match
    if (!activeItem) {
      activeCategory = siteConfig.categories["models"];
      activeSection = activeCategory.sections["impedances"];
      activeItem = activeSection.items[0];
    }

    // 4. UPDATE PAGE TITLE & IFRAME (MAIN CONTENT)
    const titleEl = document.getElementById("pageTitle");
    const frameEl = document.getElementById("contentFrame");

    const fullTitle = `${activeItem.label} - Harmony`;
    if (titleEl) titleEl.textContent = fullTitle; // This line might not be necessary
    document.title = fullTitle;

    if (frameEl) frameEl.src = activeItem.src;

    // 5. DYNAMICALLY BUILD THE SIDEBAR LEFT MENU
    const sidenavEl = document.getElementById("dynamicSidenav");
    if (!sidenavEl) return;

    const currentGroup = activeSection || activeCategory;
    const linksHTML = currentGroup?.items
      .map((item) => {
        const isActive = item.id.toLowerCase() === activeItem.id.toLowerCase();
        const activeClass = isActive ? " active" : "";

        // Determine href based on page_layout flag
        const href = item.page_layout 
          ? `./page_layout.html?file=${item.id}` 
          : item.src;

        return `<a class="list-group-item${activeClass}" href="${href}">${item.label}</a>`;
      })
      .join("\n");

    sidenavEl.innerHTML = `
      <div class="sidenav-card">
        <button id="catAccBtn" class="sidenav-acc" type="button" aria-expanded="true" aria-controls="catMenu">
          <span class="acc-icon" aria-hidden="true">▾</span>
          <span class="acc-title">${currentGroup?.title || ""}</span>
        </button>

        <div id="catMenu" class="acc-panel">
          <div class="list-group list-group-flush">
            ${linksHTML}
          </div>
        </div>
      </div>
    `;

    // 6. ATTACH COLLAPSIBLE TOGGLE EVENT TO THE GENERATED BUTTON (LEFT-SIDE MENU)
    const accBtn = document.getElementById("catAccBtn");
    const accPanel = document.getElementById("catMenu");
    const accIcon = accBtn?.querySelector(".acc-icon");

    if (accBtn && accPanel && accIcon) {
      accBtn.addEventListener("click", () => {
        const isExpanded = accBtn.getAttribute("aria-expanded") === "true";
        accBtn.setAttribute("aria-expanded", !isExpanded);
        accPanel.style.display = isExpanded ? "none" : "";
        accIcon.textContent = isExpanded ? "▸" : "▾";
      });
    }
  })();
</script>

</body>
</html>
